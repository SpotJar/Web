<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A trip for you | SpotJar</title>
  <meta name="description" content="Somebody shared a trip with you. Open it in SpotJar.">
  <!-- Every shared trip lives here for a day only; nothing to index. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F6F1E8">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SpotJar">
  <meta property="og:title" content="A trip for you">
  <meta property="og:description" content="Somebody shared a trip with you. Open it in SpotJar – the link works for 24 hours.">
  <meta property="og:image" content="https://spotjar.app/img/icon-512.png">

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

  <link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/policy.css">
  <style>
    .trip-link { text-align: center; }
    .trip-link__actions { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 2rem; }
    .trip-link__open { display: inline-block; padding: 0.9rem 1.6rem; border-radius: 11px; background: #247E76; color: #FDF8F2; font-weight: 600; text-decoration: none; }
    .trip-link__badge img { height: 48px; width: auto; }
    .trip-link__note { opacity: 0.75; font-size: 0.95rem; }
  </style>
</head>
<body>
  <!--
    The page behind every trip link, https://spotjar.app/t/#<id>.

    With SpotJar installed the link opens the app directly (universal links
    on iOS, verified app links on Android, see /.well-known/) and this page
    is never shown. Without it, or when the system did not hand the link to
    the app, it offers the app and a button that opens it by its own scheme.

    The trip id is in the fragment (#…), which browsers never send: GitHub
    Pages, which serves this file, never learns which trip was opened. This
    page reads no trip data either.
  -->
  <header class="site-header">
    <div class="container">
      <a class="pill" href="../">SpotJar</a>
    </div>
  </header>

  <main id="main" class="policy trip-link">
    <div class="policy__head">
      <img src="../img/logo-light.webp" alt="SpotJar" width="700" height="306">
      <h1 data-en="A trip for you" data-de="Ein Trip für dich">A trip for you</h1>
    </div>

    <p id="intro"
       data-en="Somebody shared a trip with you. Open it in SpotJar and it is added to your trips – spots, days and photos included."
       data-de="Jemand hat einen Trip mit dir geteilt. Öffne ihn in SpotJar, dann landet er mit Spots, Tagen und Fotos bei deinen Trips.">
      Somebody shared a trip with you. Open it in SpotJar and it is added to your trips – spots, days and photos included.
    </p>

    <div class="trip-link__actions">
      <a id="open" class="trip-link__open" href="#"
         data-en="Open in SpotJar" data-de="In SpotJar öffnen">Open in SpotJar</a>
      <a class="trip-link__badge" href="https://apps.apple.com/at/app/spotjar/id6803794730">
        <img src="../images/badges/app-store.svg" alt="Download on the App Store">
      </a>
      <p class="trip-link__note"
         data-en="No SpotJar yet? Install it, then open this link again. Android is coming soon."
         data-de="Noch kein SpotJar? Installiere die App und öffne diesen Link danach noch einmal. Android folgt bald.">
        No SpotJar yet? Install it, then open this link again. Android is coming soon.
      </p>
      <p class="trip-link__note"
         data-en="A shared trip can be opened for 24 hours."
         data-de="Ein geteilter Trip lässt sich 24 Stunden lang öffnen.">
        A shared trip can be opened for 24 hours.
      </p>
    </div>
  </main>

  <script>
    (function () {
      var german = (navigator.language || '').toLowerCase().indexOf('de') === 0;
      if (german) {
        document.documentElement.lang = 'de';
        document.title = 'Ein Trip für dich | SpotJar';
        document.querySelectorAll('[data-de]').forEach(function (element) {
          element.textContent = element.getAttribute('data-de');
        });
      }

      var id = window.location.hash.replace(/^#/, '');
      var open = document.getElementById('open');
      if (/^[A-Za-z0-9]{16,64}$/.test(id)) {
        open.href = 'spotjar://t/' + id;
      } else {
        open.remove();
        var intro = document.getElementById('intro');
        intro.textContent = german
          ? 'Dieser Link ist unvollständig. Bitte die Person, ihn noch einmal zu schicken.'
          : 'This link is incomplete. Ask whoever sent it to send it again.';
      }
    })();
  </script>
</body>
</html>
